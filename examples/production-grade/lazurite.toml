[project]
name = "production-grade"
module = "github.com/lazuli-lang/example-production-grade"
schema = 1

[lazuli]
runtime = "0.1.0"

[lazurite]
template = "lazurite-default"
template_version = "0.1.0"

[generate.go]
out = "dist/go"
gofmt = true
strict = true
emit_main = true
submodule = true

[migrations]
generated = "dist/go/migrations"
manual = "migrations"
strategy = "auto"
