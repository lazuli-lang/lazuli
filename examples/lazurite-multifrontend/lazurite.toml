[project]
name = "lazurite-multifrontend"
module = "github.com/lazuli/example-multifrontend"
schema = 1

[lazuli]
runtime = "0.1.0"

[lazurite]
template = "lazurite-default"
template_version = "0.1.0"

[generate.go]
out = "dist/go"
gofmt = true
strict = true
emit_main = true
submodule = true

[frontends.mobile]
target = "expo"
out = "dist/ts-mobile"
audiences = ["traveler", "host"]

[frontends.web-host]
target = "tanstack-vite"
out = "dist/ts-web-host"
audiences = ["host"]

[frontends.admin]
target = "tanstack-vite"
out = "dist/ts-admin"
audiences = ["admin"]

[migrations]
generated = "dist/go/migrations"
manual = "migrations"
strategy = "auto"
