# Lazuli framework workspace-level rustfmt config.
#
# STABLE-canonical (matches CI). CI invokes `cargo fmt --all --check` on the
# stable toolchain (.github/workflows/ci.yml), so this config holds only
# stable-channel options — a stable `cargo fmt` runs warning-free and its
# output is the enforced canonical. (The previous config carried nightly-only
# options — `imports_granularity`, `group_imports`, `format_code_in_doc_comments`,
# `doc_comment_code_block_width`, `wrap_comments` — which stable silently
# ignored, so the repo drifted: files formatted on nightly read as "dirty" to
# the stable CI gate. Dropping them makes stable and nightly agree. Existing
# std/external/local import grouping is preserved by the default
# `group_imports = "Preserve"`.)
#
# Conventions: 100-char lines (Rails' rdoc renders 80-col but Rust idiom is
# 100 — splitting the difference); imports reordered; modules reordered
# (explicit imports over wildcard re-exports, per Rails — wildcards hide which
# symbols are consumed and make `cargo public-api --diff` harder to reason
# about).
edition = "2024"
max_width = 100
reorder_imports = true
reorder_modules = true
