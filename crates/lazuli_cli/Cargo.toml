[package]
name = "lazuli_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "lazuli"
path = "src/main.rs"

[features]
# Gates `tests/mobile_smoke.rs` end-to-end TS typecheck. Two-gate
# pattern (Cargo feature + `LAZULI_TS_SMOKE=1` env var) mirrors the
# convention in `lazuli_codegen_ts`. Default `cargo test` is unaffected.
smoke = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
colored = "2.1"
include_dir = "0.7"
is-terminal = "0.4"
lazuli_analyzer = { path = "../lazuli_analyzer" }
lazuli_changelog = { path = "../lazuli_changelog" }
lazuli_codegen_go = { path = "../lazuli_codegen_go" }
lazuli_codegen_spec = { path = "../lazuli_codegen_spec" }
lazuli_codegen_ts = { path = "../lazuli_codegen_ts" }
lazuli_doctor = { path = "../lazuli_doctor" }
lazuli_doctor_config = { path = "../lazuli_doctor_config" }
lazuli_fix = { path = "../lazuli_fix" }
lazuli_ir = { path = "../lazuli_ir" }
lazuli_lsp = { path = "../lazuli_lsp" }
lazuli_manifest = { path = "../lazuli_manifest" }
lazuli_openapi = { path = "../lazuli_openapi" }
lazuli_planner = { path = "../lazuli_planner" }
lazuli_syntax = { path = "../lazuli_syntax" }
serde.workspace = true
serde_json.workspace = true
notify = "6"
tokio.workspace = true
toml = "0.8"
tower-lsp.workspace = true

[dev-dependencies]
tempfile = "3"
