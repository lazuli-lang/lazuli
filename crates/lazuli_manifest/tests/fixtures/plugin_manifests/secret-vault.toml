version = "0.1.0"
status = "in-development"
maintainer = "lazuli-core@anthropic.com"
implements = ["secrets.Provider"]

[plugin]
name = "secret-vault"
namespace = "@lazuli/plugin-secret-vault"
go_module = "github.com/lazuli-lang/lazuli-plugin-secret-vault"
description = "Vendor-pluggable secret resolution — Vault, AWS Secrets Manager, Azure Key Vault."

[env]
required = []
optional = ["VAULT_ADDR", "VAULT_TOKEN", "AWS_SECRETS_MANAGER_REGION", "AZURE_KEY_VAULT_URL"]

[vendors]
supported = ["hashicorp-vault", "aws-secrets-manager", "azure-key-vault"]
default = "hashicorp-vault"

[audit]
findings_closed = ["lazuli-cyber-stride-2026-05-20:T6.S1", "lazuli-cyber-owasp-2026-05-20:CRIT-3"]
