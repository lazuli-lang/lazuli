[workspace]
members = [
  "crates/lazuli_analyzer",
  "crates/lazuli_changelog",
  "crates/lazuli_cli",
  "crates/lazuli_codegen_go",
  "crates/lazuli_codegen_spec",
  "crates/lazuli_codegen_ts",
  "crates/lazuli_diagnostics_registry",
  "crates/lazuli_doctor",
  "crates/lazuli_doctor_config",
  "crates/lazuli_doctor_run",
  "crates/lazuli_fix",
  "crates/lazuli_ir",
  "crates/lazuli_keywords",
  "crates/lazuli_lsp",
  "crates/lazuli_manifest",
  "crates/lazuli_mcp",
  "crates/lazuli_openapi",
  "crates/lazuli_planner",
  "crates/lazuli_syntax",
  "tools/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Lazuli contributors"]

# Workspace lint baseline. CI runs `cargo clippy --workspace --all-targets --
# -D warnings`; this table is the centralized, documented record of the lints
# the workspace deliberately accepts (vs scattered `#[allow]`). The core
# disciplines from clippy.toml (file-size 500, cognitive-complexity 25) stay
# ENFORCED — these allows are narrow and justified:
#   - doc_lazy_continuation / doc_overindented_list_items: cosmetic markdown
#     list-rendering in Rails-style multi-paragraph rustdoc; no code-quality
#     signal, ~90 sites — a burn-down item, not a gate.
#   - too_many_arguments: several emitter/codegen entry points take the full
#     IR slice as positional args by design; the fix (builder structs) is an
#     invasive API churn deferred to a focused refactor.
#   - large_enum_variant: boxing the large variant changes public enum layout
#     / call sites; deferred.
#   - type_complexity: a few projector signatures; factoring into `type`
#     aliases is judgment, deferred.
# The test suite is split into ~60 `include!`-chunk fragments (SPEC-19, to hold
# every `.rs` <= 500 LOC). Each fragment carries its own `use` block but they
# share ONE module scope after `include!`, so an import used in fragment A reads
# as "unused" in sibling fragment B, and a helper used only across fragments
# reads as "never used". rustc can't follow `include!`, so these two lints have
# an irreducible false-positive rate under this architecture (the repo already
# carries file-level `#![allow(unused_imports)]` on the registry chunks). IDEs
# still surface genuine cases during editing; `unused_must_use` (dropped errors)
# stays ENFORCED.
[workspace.lints.rust]
unused_imports = "allow"
dead_code = "allow"

[workspace.lints.clippy]
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
type_complexity = "allow"
# Incremental `let mut x = X::default(); x.field = …` construction is the
# clearer form for the large IR-struct test fixtures (a 30-field struct literal
# with `..Default::default()` obscures which fields the test actually sets);
# allowed as a deliberate style choice.
field_reassign_with_default = "allow"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-std", "macros", "rt", "rt-multi-thread", "sync", "time"] }
tower-lsp = "0.20"

[profile.test]
debug = 0
