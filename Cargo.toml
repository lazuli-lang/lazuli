[workspace]
members = [
  "crates/lazuli_analyzer",
  "crates/lazuli_cli",
  "crates/lazuli_codegen_go",
  "crates/lazuli_codegen_ts",
  "crates/lazuli_ir",
  "crates/lazuli_lsp",
  "crates/lazuli_mcp",
  "crates/lazuli_planner",
  "crates/lazuli_syntax",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Lazuli contributors"]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
insta = { version = "1", features = ["json"] }
pest = "2.8"
pest_derive = "2.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-std", "macros", "rt", "rt-multi-thread", "sync"] }
tower-lsp = "0.20"
