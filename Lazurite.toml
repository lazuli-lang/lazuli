# Lazuli framework workspace-root manifest.
#
# This is NOT a Lazuli app — it's the framework's own self-application of
# the doctor. The `tdd-iron-hand` preset across all three doctor blocks
# (coverage, test_discipline, internal_hygiene) is the editorial veto
# mechanism: a single config-line escalates rules to `error` workspace-wide,
# analogous to Rails' .rubocop.yml + .rspec consolidated config.
#
# Sem escape exceto via `severity_override` com `reason` documentado
# (enforced by DOCTOR-OVERRIDE-NEEDS-REASON-001).
#
# Refs:
#   - docs/proposals/tdd-bdd-first-2026-05-23.md (Wave 0.5 + Wave 6)
#   - The canonical pilot app serves the same role Basecamp serves for
#     Rails — concrete shape the framework optimizes for; not vendored
#     into the public repo.

[project]
name = "lazuli"
module = "github.com/lazuli-lang/lazuli"
schema = 1

[lazuli]
# Reserved value — framework does not pin its own runtime version.
runtime = "self"

[doctor]
profile = "production"

# Wave 6 — already-existing preset. Locks all coverage layers (handler_go,
# spec_predicate, spec_actor_matrix, spec_transition_state, view_extensibility,
# view_e2e_pair) to 90/95 warn/block thresholds.
[doctor.coverage]
preset = "tdd-iron-hand"

# W1.5 — extends preset mechanism to test_discipline category. Under
# `tdd-iron-hand`, every TEST-* + DOCTOR-* rule fires at `error` severity
# regardless of profile.
[doctor.test_discipline]
preset = "tdd-iron-hand"

# W3 — extends preset mechanism to internal_hygiene category. Under
# `tdd-iron-hand`, every INTERNAL-* rule (file-size, undoc-pub, no-example,
# test-pairing) fires at `error` severity.
#
# TEMPORARY overrides during W5 docstring sweep — each must carry `reason`
# and be removed in W6 once the corresponding crate reaches sweep completion.
[doctor.internal_hygiene]
preset = "tdd-iron-hand"

# Example override structure for W5 transitional period (commented out;
# uncomment per-crate as sweep starts):
#
# [doctor.internal_hygiene.severity_override.INTERNAL-NO-EXAMPLE-001]
# severity = "info"
# reason = "W5 docstring sweep in progress for lazuli_ir; restore to preset-default after sweep completes (target: rails-style-refactor branch)"

# Iron-hand 4th dimension — error-handling discipline across framework
# Rust (INTERNAL-PANIC-*, INTERNAL-ERROR-*), user .lzi/.lzx (ERROR-*,
# planned in a follow-up), and Go handlers (HANDLER-*).
#
# W7 sweep completed 2026-05-26: framework code reduced from ~1250
# panic-prone constructs to 0. Common patterns:
#   - `writeln!(String).unwrap()` → `let _ = writeln!(...)` (infallible)
#   - `Option::unwrap()` after `is_some()` → `if let Some(x) = ...`
#   - `.expect("invariant")` in stable pub ABI → `unwrap_or(default)`
#     where the fallback keeps output syntactically valid
#   - `unreachable!()` match arms → restructured or defensive parse-error
#
# Preset promoted to `tdd-iron-hand` — any new .unwrap() / .expect() /
# panic! / todo! / unimplemented! / unreachable! in non-test framework
# code now blocks merge. Test code is exempted via the rule's
# `is_rails_test_file` heuristic (any `tests.rs`, `*_tests.rs`,
# `tests_*.rs`, `test_support*.rs`, or path under `tests/` / `lib_tests/`).
[doctor.error_handling]
preset = "tdd-iron-hand"

# `.lzi` source-shape hygiene — three rules covering file size,
# file/feature name alignment, and multi-feature cohesion. Architect
# review (2026-05-27) rejected the broader "1 feature per file" rule
# in favor of `LZI-FEATURE-COHESION-001` which lets cohesive bundles
# pass (features sharing a domain prefix or resource anchor).
#
# Preset starts at `tdd-strict` (warn) — the canonical fixture
# `examples/full-capsule/full-capsule.lzi` currently fires all three
# rules (992 LOC, 6 mixed-prefix features, stem doesn't match feature
# names). Promote to `tdd-iron-hand` after either refactoring the
# fixture to per-feature files or accepting that pilot apps will
# normally land smaller and pass the rules.
#
# This block governs user .lzi files via `lazuli doctor <path>`. The
# framework workspace itself has no .lzi files so the rules are silent
# under `--self`.
[doctor.lzi_hygiene]
preset = "tdd-strict"
