id = "lazuli-improve"
name = "Lazuli Improve"
description = "Audit Lazuli for friction, gaps, and missing primitives. Output is a prioritized list of cuts, not implementation."

[command]
slug = "lazuli-improve"
description = "Audita a linguagem Lazuli e propõe cuts priorizados (vocabulário, coverage LSP/doctor/inspect, ergonomia, primitivas faltando)."

[defaults]
agent = "lazuli-language-architect"

# `medium` is the daily-driver size. `quick` cuts the audit to the
# fixture only; `deep` adds cross-checks against external review notes
# and benchmarks against published DSLs.
[[args]]
name = "depth"
description = "Profundidade da auditoria — afeta quanto material a fora do repo o agente consulta."
choices = ["quick", "medium", "deep"]
default = "medium"

# `all` audits every dimension. The named subsets let you re-run a
# single dimension when you've just shipped a cut and want a focused
# re-check without re-doing the whole audit.
[[args]]
name = "focus"
description = "Dimensão da auditoria. `all` roda o pipeline completo; os outros pulam stages para uma checagem focada."
choices = ["all", "vocabulary", "coverage", "ergonomics", "primitives"]
default = "all"

# ---------- DAG ----------

[[stages]]
id = "orient"
skills = ["lazuli-language-audit"]
tools = ["Read", "Grep", "Glob"]
prompt = """
Cold-orient on the language at this point in time. Mandatory reading
order — do not skip:

1. `docs/invariants.md` — the rules that constrain what's authorable.
2. `docs/design-decisions.md` — the canonical answer to "why isn't this
   dual form an atrito?". If a pattern appears here, it's an
   architectural choice; classifying it as friction is wrong.
3. `docs/next-checklist.md` — what's shipped, what's tracked. Do NOT
   propose anything already on the "done" list.
4. `crates/lazuli_lsp/src/lib.rs` keyword catalog (search for
   `is_allowed_reference_namespace` and `KEYWORD_HOVER`) — the closed
   set of keywords/namespaces.
5. `git log --oneline -25` — recent shipped cuts. Do NOT re-propose
   anything from the most recent 25 commits.
6. `examples/full-capsule/` — read in order: `app.lzi`, `registry.lzi`,
   `workspace.lzi`, `profiles.lzi`, `full-capsule.lzi`,
   `full-capsule.lzx`, `contracts/ai.lzi`, then platform projections.

Output: 3-4 sentences naming where the language sits today, which of
the audit dimensions (vocabulary / coverage / ergonomics / primitives)
look most pressured, AND a one-sentence acknowledgment of which
patterns from `docs/design-decisions.md` you saw in the fixture (so
you don't classify them as friction later). No proposals yet.
"""

[[stages]]
id = "audit-vocabulary"
skills = ["lazuli-language-audit"]
tools = ["Read", "Grep", "Glob"]
prompt = """
Audit for polysemy, inconsistency, and unclear naming.

**MANDATORY first step**: re-read `docs/design-decisions.md`. Any
pattern documented there is an architectural choice. If you cite a
location that's covered by a design decision, your finding is wrong —
re-classify or drop it.

Per the audit skill's "Vocabulary & polysemy" section: look for words
that mean different things in different contexts. Cross-reference the
fixture against `docs/invariants.md` claims about each keyword.

Run focused searches:
- `Grep "\\\\b(route|path|params|audience|capability|agent)\\\\b"` across
  `examples/` and `crates/` to spot drift.
- Check `editors/vscode/syntaxes/lazuli.tmLanguage.json` for keywords
  in two scope buckets that should be in one.

For each finding, include a column "Covered by design-decisions.md?"
with yes/no. If yes, drop it before output.

Output: a markdown table of findings (Finding | Where | Covered? |
Suggested rename or rule). Skip if `focus != all && focus != vocabulary`.
"""
depends_on = ["orient"]

[[stages]]
id = "audit-coverage"
skills = ["lazuli-language-audit"]
tools = ["Read", "Grep", "Glob", "Bash(cargo *)"]
prompt = """
Audit doctor / LSP / inspect / highlighting / IR coverage for every
construct in the fixture.

For each construct (commands, queries, jobs, webhooks, agents,
workflows, contracts, workspace, profiles, packs, integrations,
derived fields, has_many, audit, route slots, surfaces, audiences,
extensions): walk the 5-artifact matrix from the audit skill.

Useful probes:
- `cargo run -q -p lazuli_cli -- inspect examples/full-capsule/<file>`
- `cargo run -q -p lazuli_cli -- doctor examples/full-capsule`
- `Grep "fn .*_diagnostics" crates/lazuli_lsp/src/lib.rs`

Use the `Task` tool to dispatch a sub-agent for each artifact in
parallel if the audit is wide. Otherwise inline.

Output: table of (Construct | Doctor? | LSP? | Inspect? | Highlight?
| IR?) with row anchored to a `path:line` for each "no". Skip if
`focus != all && focus != coverage`.
"""
depends_on = ["orient"]

[[stages]]
id = "audit-ergonomics"
skills = ["lazuli-language-audit", "lazuli-quality-rubric"]
tools = ["Read", "Grep"]
prompt = """
Audit token economy and ergonomics.

For each repeated pattern in the fixture (>3 occurrences), measure
boilerplate per occurrence. Examples to inspect explicitly:

- `policy @policy.<name>` declarations across commands.
- `previously migrated <name>` chains.
- `emits <event_name>` payload mapping repetition.
- `tests` blocks: any redundancy across rules / commands /
  workflows / anchors.

Also check for two surface forms of the same intent (criterion 5 of
the rubric — determinism). Each one is a deduction.

Output: table (Pattern | Locations | Estimated waste tokens |
Suggested sugar or rule). Skip if `focus != all && focus != ergonomics`.
"""
depends_on = ["orient"]

[[stages]]
id = "audit-primitives"
skills = ["lazuli-language-audit"]
tools = ["Read", "Grep"]
prompt = """
Audit for missing primitives.

**MANDATORY pre-grep gate.** Before adding ANY primitive to your
output, run these greps. If the keyword has any hit, the construct
already exists — do NOT propose it as missing:

```
Grep "^  notification "   path=examples
Grep "^  agent "          path=examples
Grep "event\\.trace"      path=examples
Grep "escape_route"       path=examples
Grep "has_many"           path=examples
Grep "derived from"       path=examples
Grep "^    audit"         path=examples
Grep "validates @validator" path=examples
Grep "^  query\\.list"    path=examples
Grep "^  query\\.lookup"  path=examples
```

After the gate, walk the fixture for *real* handler escape hatches:
`handler "./..."`, `verify "./..."`, raw Go file references that the
language doesn't yet model. Each is a candidate primitive unless the
variation across calls is too high.

For each candidate that survived the gate, write:
- What it would replace in the fixture (cite `path:line`).
- The minimal contract: required children, validation rules, inspect
  shape.
- The boundary against Drusa/adapters — what Drusa generates from this
  primitive vs. what the primitive declares.

Output: ranked list of candidate primitives. Be ruthless about cost
vs. value — only propose if the fixture has at least 2 use sites and
the construct keyword does not appear anywhere in `examples/`. Skip
the entire stage if `focus != all && focus != primitives`.
"""
depends_on = ["orient"]

[[stages]]
id = "propose-cuts"
skills = ["lazuli-language-audit"]
tools = ["Read"]
prompt = """
Consolidate findings from the four audit stages into a single
prioritized cut list.

For each finding produced upstream:
1. Classify: polish | coverage gap | primitive | boundary violation.
2. Estimate cost (rough hours of implementation) and value (impact on
   readability / AI-fit / coverage).
3. Sort by cost-adjusted value descending.

Boundary violations always go first and are non-negotiable — they
need reverting, not deferring.

Output a single markdown table:

| Rank | Cut | Class | Cost | Value | Why |

Below the table, suggest the 3 cuts you'd ship next as a tracked
addition to `docs/next-checklist.md` — formatted as the existing
table rows in that file so the user can paste them directly.

Do NOT implement anything. The pipeline is reconnaissance, not
delivery.
"""
depends_on = ["audit-vocabulary", "audit-coverage", "audit-ergonomics", "audit-primitives"]

[[stages]]
id = "review"
type = "checkpoint"
tools = ["Read", "Bash(git status*)", "Bash(git diff*)"]
prompt = """
Final summary for the user:

- Number of findings per class (polish / coverage / primitive /
  boundary).
- Top 3 recommended cuts (from `propose-cuts`).
- Anything that surprised you about the language at this point in
  time.

Do NOT add the cuts to `docs/next-checklist.md` yourself — paste the
suggested rows into the chat for the user to merge. The checklist is
edited by humans.

Stop here. The user decides what to ship.
"""
depends_on = ["propose-cuts"]
