# Lazuli framework CI — Rails-style enforcement.
#
# Five gates, all required for merge to main:
#   1. fmt-check     — `cargo fmt --all --check` (rustfmt.toml conventions)
#   2. clippy        — `cargo clippy --workspace -- -D warnings` (clippy.toml)
#   3. test          — `cargo test --workspace` (all crates green)
#   4. doc           — `cargo doc --workspace --no-deps` (no broken intra-doc-links)
#   5. self-doctor   — `lazuli doctor --self --fail-on category:internal_hygiene
#                       --fail-on category:test_discipline` (dogfooding)
#
# The last gate is the editorial veto: under `tdd-iron-hand` preset
# (Lazurite.toml workspace-root), this command exits non-zero on:
#   - any file > 5k LOC
#   - any pub item without rustdoc
#   - any pub fn without compilable `## Examples`
#   - any *.rs without `#[cfg(test)] mod tests` or sibling `tests/foo_test.rs`
#   - any TEST-* / DOCTOR-* rule finding from test_discipline category
#
# Refs:
#   - Lazurite.toml (workspace root)

name: Lazuli CI

on:
  push:
    branches: [main, "rails-style-refactor"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt-check:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --no-fail-fast

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D rustdoc::broken-intra-doc-links -D rustdoc::private-intra-doc-links"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --document-private-items

  self-doctor:
    name: lazuli-dev self-doctor
    runs-on: ubuntu-latest
    needs: [clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # SPEC-20 2/n: the self-audit moved off the published `lazuli` binary to
      # the framework-dev `lazuli-dev` binary (`self-doctor` ≡ the old
      # `lazuli doctor --self`).
      - name: Build lazuli-dev CLI
        run: cargo build --release -p lazuli_cli --bin lazuli-dev
      - name: Doctor self-check (dogfood)
        run: |
          ./target/release/lazuli-dev self-doctor \
            --security-profile strict \
            --fail-on category:internal_hygiene \
            --fail-on category:test_discipline \
            --format json > self-doctor-report.json
      - name: Upload self-doctor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-doctor-report
          path: self-doctor-report.json

  fixtures-check:
    name: fixtures drift-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check fixtures for drift
        run: pwsh -File tools/generate-fixtures.ps1 -Check
