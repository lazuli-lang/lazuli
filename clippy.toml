# Lazuli framework workspace-level clippy config.
#
# Aligned with the `tdd-iron-hand` posture from workspace Lazurite.toml:
# strict thresholds, no escape via lint suppressions without justification.
#
# CI invokes: cargo clippy --workspace --all-targets -- -D warnings
# (per .github/workflows/ci.yml W1 wave)

# Block files / functions that grow too large. Mirrors the
# INTERNAL-FILE-SIZE-001 doctor rule (W3) at the clippy layer so violations
# fire during `cargo clippy` BEFORE `lazuli doctor --self` even runs.
too-many-lines-threshold = 500

# Functions with cognitive complexity > 25 are usually candidates for
# extraction. Mirrors the Rails ActiveRecord style of "small focused
# methods composed via inheritance/concerns".
cognitive-complexity-threshold = 25

# Unwrap discipline is enforced by the doctor rule INTERNAL-PANIC-UNWRAP-001,
# NOT by a clippy `disallowed-methods` entry. That rule is TEST-AWARE (tracks
# `#[cfg(test)] mod` depth so test code unwraps freely) and is deliberately
# warn-only under the workspace `[doctor.error_handling]` posture until the W7
# production-unwrap sweep. clippy `disallowed-methods` has NO test carve-out, so
# under `--all-targets -D warnings` it fired on ~630 idiomatic test unwraps and
# contradicted the doctor rule's warn-only stance. The doctor rule is canonical.

# Allow longer docstring example blocks (Rails-style docs have multi-step
# `## Examples` that compile via `cargo test --doc`).
doc-valid-idents = ["Lazuli", "Lazurite", "Rails", "Basecamp", "ActiveRecord", "rustdoc", "rust-analyzer", "RDoc"]
